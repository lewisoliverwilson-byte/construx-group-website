<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Construx Group — Concept A: Shader Field</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <link href="https://api.fontshare.com/v2/css?f[]=clash-display@700,600,500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #000008;
      --text: rgba(255,255,255,0.9);
      --muted: rgba(255,255,255,0.35);
      --border: rgba(255,255,255,0.07);
    }

    html, body {
      width: 100%; height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      overflow: hidden;
    }

    canvas#gl {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      display: block;
    }

    /* ── Overlay ── */
    #overlay {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 28px 36px 32px;
      pointer-events: none;
    }

    /* ── Nav ── */
    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .nav-logo {
      font-family: 'Clash Display', sans-serif;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text);
    }

    .nav-label {
      font-family: 'SF Mono', 'Fira Code', 'Fira Mono', monospace;
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 0.05em;
    }

    /* ── Hero ── */
    .hero {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      gap: 18px;
      padding-bottom: 60px;
    }

    .hero-title {
      font-family: 'Clash Display', sans-serif;
      font-weight: 700;
      font-size: clamp(52px, 9vw, 108px);
      line-height: 0.88;
      letter-spacing: -0.02em;
      color: #fff;
    }

    .hero-tagline {
      font-family: 'Inter', sans-serif;
      font-weight: 300;
      font-size: 15px;
      color: rgba(255,255,255,0.38);
      letter-spacing: 0.01em;
    }

    /* ── Cards row ── */
    .cards-row {
      display: flex;
      gap: 12px;
      justify-content: center;
      align-items: flex-end;
      pointer-events: all;
    }

    .card {
      width: 182px;
      flex-shrink: 0;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      background: rgba(0,0,0,0.45);
      border: 1px solid rgba(255,255,255,0.07);
      border-top: 2px solid var(--accent);
      border-radius: 5px;
      padding: 16px 18px;
      cursor: default;
      transition: transform 0.28s cubic-bezier(0.22,1,0.36,1), box-shadow 0.28s ease;
      will-change: transform;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 32px -4px color-mix(in srgb, var(--accent) 40%, transparent),
                  0 0 0 1px color-mix(in srgb, var(--accent) 20%, transparent);
    }

    .card-category {
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--accent);
      margin-bottom: 7px;
    }

    .card-name {
      font-family: 'Clash Display', sans-serif;
      font-weight: 600;
      font-size: 17px;
      color: #fff;
      margin-bottom: 5px;
      line-height: 1.1;
    }

    .card-tagline {
      font-family: 'Inter', sans-serif;
      font-weight: 300;
      font-size: 11px;
      color: rgba(255,255,255,0.35);
      margin-bottom: 13px;
      line-height: 1.5;
    }

    .badge {
      display: inline-block;
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 3px 8px;
      border-radius: 3px;
    }

    .badge-live {
      color: #4ade80;
      background: rgba(74,222,128,0.1);
      border: 1px solid rgba(74,222,128,0.2);
    }

    .badge-dev {
      color: rgba(255,255,255,0.5);
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
    }

    /* ── Concept switcher ── */
    #switcher {
      position: fixed;
      bottom: 28px;
      right: 36px;
      z-index: 20;
      display: flex;
      gap: 8px;
      pointer-events: all;
    }

    .sw-link {
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 5px 10px;
      border-radius: 3px;
      text-decoration: none;
      color: rgba(255,255,255,0.4);
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(10px);
      transition: color 0.18s, border-color 0.18s, background 0.18s;
    }

    .sw-link:hover {
      color: rgba(255,255,255,0.8);
      border-color: rgba(255,255,255,0.25);
    }

    .sw-link.active {
      color: #fff;
      border-color: rgba(255,255,255,0.35);
      background: rgba(255,255,255,0.07);
    }
  </style>
</head>
<body>

<canvas id="gl"></canvas>

<div id="overlay">
  <nav>
    <span class="nav-logo">Construx Group</span>
    <span class="nav-label">Concept A — Shader Field</span>
  </nav>

  <div class="hero">
    <h1 class="hero-title">CONSTRUX<br>GROUP</h1>
    <p class="hero-tagline">We build what only AI makes possible.</p>
  </div>

  <div class="cards-row" id="cardsRow"></div>
</div>

<div id="switcher">
  <a href="/concept-a.html" class="sw-link active">A</a>
  <a href="/concept-b.html" class="sw-link">B</a>
  <a href="/concept-c.html" class="sw-link">C</a>
</div>

<script>
// ─────────────────────────────────────────────
// VENTURE DATA
// ─────────────────────────────────────────────
const VENTURES = [
  { name: 'Scoutr',           tagline: 'Find what others miss.',          accent: '#C8F50C', status: 'live', category: 'Resell Intelligence' },
  { name: 'The Marqet',       tagline: 'The App Store for Claude AI.',    accent: '#3B82F6', status: 'live', category: 'AI Marketplace' },
  { name: 'The Hyve',         tagline: 'Where AI teams actually work.',   accent: '#8B5CF6', status: 'live', category: 'AI Workspace' },
  { name: 'Construx Daily',   tagline: 'AI intelligence, delivered daily.',accent: '#F59E0B', status: 'dev',  category: 'AI Newsletter' },
  { name: 'Construx Studio',  tagline: 'Beautiful software, built fast.', accent: '#06B6D4', status: 'dev',  category: 'Web Studio' },
];

// ─────────────────────────────────────────────
// BUILD CARDS
// ─────────────────────────────────────────────
let hoveredIdx = -1;
const cardsRow = document.getElementById('cardsRow');

VENTURES.forEach((v, i) => {
  const card = document.createElement('div');
  card.className = 'card';
  card.style.setProperty('--accent', v.accent);

  card.innerHTML = `
    <div class="card-category">${v.category}</div>
    <div class="card-name">${v.name}</div>
    <div class="card-tagline">${v.tagline}</div>
    <span class="badge badge-${v.status}">${v.status === 'live' ? 'Live' : 'In Dev'}</span>
  `;

  card.addEventListener('mouseenter', () => { hoveredIdx = i; });
  card.addEventListener('mouseleave', () => { hoveredIdx = -1; });

  cardsRow.appendChild(card);
});

// ─────────────────────────────────────────────
// WEBGL SETUP
// ─────────────────────────────────────────────
const canvas = document.getElementById('gl');
const gl = canvas.getContext('webgl', { antialias: false, alpha: false });

if (!gl) {
  console.error('WebGL not supported');
}

// ── Vertex shader ──
const VS = `
attribute vec2 aPosition;
void main() {
  gl_Position = vec4(aPosition, 0.0, 1.0);
}
`;

// ── Fragment shader ──
const FS = `
precision highp float;

uniform float uTime;
uniform vec2  uResolution;
uniform vec2  uMouse;
uniform int   uHoverIdx;

// Accent colors for each venture (matching JS)
// 0 Scoutr      #C8F50C  -> vec3(0.784, 0.961, 0.047)
// 1 The Marqet  #3B82F6  -> vec3(0.231, 0.510, 0.965)
// 2 The Hyve    #8B5CF6  -> vec3(0.545, 0.361, 0.965)
// 3 ConstruxD   #F59E0B  -> vec3(0.961, 0.620, 0.043)
// 4 ConstruxS   #06B6D4  -> vec3(0.024, 0.714, 0.831)

float hash21(vec2 p) {
  p = fract(p * vec2(127.1, 311.7));
  p += dot(p, p + 19.19);
  return fract(p.x * p.y);
}

float noise(vec2 p) {
  vec2 i = floor(p);
  vec2 f = fract(p);
  vec2 u = f * f * (3.0 - 2.0 * f);

  float a = hash21(i);
  float b = hash21(i + vec2(1.0, 0.0));
  float c = hash21(i + vec2(0.0, 1.0));
  float d = hash21(i + vec2(1.0, 1.0));

  return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
}

float fbm(vec2 p) {
  float v = 0.0;
  float amp = 0.5;
  float freq = 1.0;
  for (int i = 0; i < 5; i++) {
    v += amp * noise(p * freq);
    freq *= 2.1;
    amp  *= 0.48;
    p += vec2(0.31, 0.17) * float(i + 1);
  }
  return v;
}

void main() {
  vec2 uv = gl_FragCoord.xy / uResolution.xy;
  // aspect-correct
  vec2 uvA = vec2(uv.x * (uResolution.x / uResolution.y), uv.y);

  float t = uTime * 0.09;

  // ── Domain warp level 1 ──
  vec2 q = vec2(
    fbm(uvA + t),
    fbm(uvA + vec2(1.7, 9.2) + t * 0.85)
  );

  // ── Domain warp level 2 ──
  vec2 r = vec2(
    fbm(uvA + 4.0 * q + vec2(1.7, 9.2) + t * 0.6),
    fbm(uvA + 4.0 * q + vec2(8.3, 2.8) + t * 0.5)
  );

  float f = fbm(uvA + 4.2 * r);
  f = f * f * f;  // sharpen contrast
  f = clamp(f, 0.0, 1.0);

  // ── Base color: near-black deep space ──
  vec3 col = vec3(0.0, 0.0, 0.018);

  // ── Per-venture bloom (UNROLLED — no arrays) ──

  // Venture 0: Scoutr — lime #C8F50C
  vec2 pos0 = vec2(0.1, 0.78);
  vec3 acc0 = vec3(0.784, 0.961, 0.047);
  float hover0 = (uHoverIdx == 0) ? 0.24 : 0.08;
  float bloom0 = smoothstep(0.5, 0.0, length(uv - pos0)) * f * hover0;
  col += bloom0 * acc0;

  // Venture 1: The Marqet — blue #3B82F6
  vec2 pos1 = vec2(0.3, 0.78);
  vec3 acc1 = vec3(0.231, 0.510, 0.965);
  float hover1 = (uHoverIdx == 1) ? 0.24 : 0.08;
  float bloom1 = smoothstep(0.5, 0.0, length(uv - pos1)) * f * hover1;
  col += bloom1 * acc1;

  // Venture 2: The Hyve — purple #8B5CF6
  vec2 pos2 = vec2(0.5, 0.78);
  vec3 acc2 = vec3(0.545, 0.361, 0.965);
  float hover2 = (uHoverIdx == 2) ? 0.24 : 0.08;
  float bloom2 = smoothstep(0.5, 0.0, length(uv - pos2)) * f * hover2;
  col += bloom2 * acc2;

  // Venture 3: Construx Daily — amber #F59E0B
  vec2 pos3 = vec2(0.7, 0.78);
  vec3 acc3 = vec3(0.961, 0.620, 0.043);
  float hover3 = (uHoverIdx == 3) ? 0.24 : 0.08;
  float bloom3 = smoothstep(0.5, 0.0, length(uv - pos3)) * f * hover3;
  col += bloom3 * acc3;

  // Venture 4: Construx Studio — cyan #06B6D4
  vec2 pos4 = vec2(0.9, 0.78);
  vec3 acc4 = vec3(0.024, 0.714, 0.831);
  float hover4 = (uHoverIdx == 4) ? 0.24 : 0.08;
  float bloom4 = smoothstep(0.5, 0.0, length(uv - pos4)) * f * hover4;
  col += bloom4 * acc4;

  // ── Subtle aurora overlay — dim blue-purple layer ──
  float aurora = fbm(uvA * 1.4 + vec2(t * 0.5, 0.0));
  aurora = aurora * aurora;
  float auroraHeight = smoothstep(0.0, 0.6, uv.y) * smoothstep(1.0, 0.5, uv.y);
  col += aurora * auroraHeight * 0.055 * vec3(0.15, 0.08, 0.45);
  col += aurora * auroraHeight * 0.03  * vec3(0.0,  0.1,  0.35);

  // ── Mouse glow: cold blue-white ──
  vec2 mouseDelta = uv - uMouse;
  float mouseDist = length(mouseDelta);
  float mouseGlow = exp(-mouseDist * 5.0) * 0.08 * f;
  col += mouseGlow * vec3(0.6, 0.75, 1.0);

  // ── Vignette ──
  vec2 vigUV = uv * (1.0 - uv.yx);
  float vig = pow(vigUV.x * vigUV.y * 14.0, 0.35);
  vig = clamp(vig, 0.0, 1.0);
  col *= vig;

  // ── Gamma ──
  col = pow(col, vec3(0.82));

  gl_FragColor = vec4(col, 1.0);
}
`;

function compileShader(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    console.error('Shader compile error:', gl.getShaderInfoLog(s));
    gl.deleteShader(s);
    return null;
  }
  return s;
}

const vs = compileShader(gl.VERTEX_SHADER, VS);
const fs = compileShader(gl.FRAGMENT_SHADER, FS);

const prog = gl.createProgram();
gl.attachShader(prog, vs);
gl.attachShader(prog, fs);
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
  console.error('Program link error:', gl.getProgramInfoLog(prog));
}
gl.useProgram(prog);

// Full-screen quad (triangle strip, 4 verts)
const quad = new Float32Array([
  -1, -1,
   1, -1,
  -1,  1,
   1,  1,
]);
const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, quad, gl.STATIC_DRAW);

const aPos = gl.getAttribLocation(prog, 'aPosition');
gl.enableVertexAttribArray(aPos);
gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

// Uniform locations
const uTime       = gl.getUniformLocation(prog, 'uTime');
const uResolution = gl.getUniformLocation(prog, 'uResolution');
const uMouse      = gl.getUniformLocation(prog, 'uMouse');
const uHoverIdx   = gl.getUniformLocation(prog, 'uHoverIdx');

// ─────────────────────────────────────────────
// STATE
// ─────────────────────────────────────────────
let mouseX = 0.5, mouseY = 0.5;
let startTime = performance.now();

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width  = window.innerWidth  * dpr;
  canvas.height = window.innerHeight * dpr;
  canvas.style.width  = window.innerWidth  + 'px';
  canvas.style.height = window.innerHeight + 'px';
  gl.viewport(0, 0, canvas.width, canvas.height);
}

window.addEventListener('resize', resize);
resize();

window.addEventListener('mousemove', (e) => {
  mouseX = e.clientX / window.innerWidth;
  mouseY = 1.0 - (e.clientY / window.innerHeight); // flip Y for GL
});

// ─────────────────────────────────────────────
// RENDER LOOP
// ─────────────────────────────────────────────
function render() {
  const t = (performance.now() - startTime) * 0.001;

  gl.uniform1f(uTime, t);
  gl.uniform2f(uResolution, canvas.width, canvas.height);
  gl.uniform2f(uMouse, mouseX, mouseY);
  gl.uniform1i(uHoverIdx, hoveredIdx);

  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

  requestAnimationFrame(render);
}

requestAnimationFrame(render);
</script>
</body>
</html>
