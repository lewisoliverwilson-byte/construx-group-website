<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Construx Group — Concept B: 3D Geometric</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=clash-display@700,600,500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #000008;
    --text: rgba(255,255,255,0.92);
    --muted: rgba(255,255,255,0.35);
    --border: rgba(255,255,255,0.07);
    --font-display: 'Clash Display', sans-serif;
    --font-body: 'Inter', sans-serif;
  }

  html, body {
    width: 100%; height: 100%;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
    font-family: var(--font-body);
  }

  #three-canvas {
    position: fixed; inset: 0;
    z-index: 0;
    display: block;
  }

  .overlay {
    position: fixed; inset: 0;
    z-index: 10;
    pointer-events: none;
    display: flex;
    flex-direction: column;
  }

  /* Nav */
  .nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 28px 36px 0;
    pointer-events: all;
  }
  .nav-brand {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 12px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--text);
    text-decoration: none;
  }
  .nav-label {
    font-family: 'Courier New', monospace;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.08em;
  }

  /* Hero text */
  .hero {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 0 24px;
    pointer-events: none;
    user-select: none;
  }
  .hero-eyebrow {
    font-family: 'Courier New', monospace;
    font-size: 10px;
    letter-spacing: 0.25em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 18px;
  }
  .hero-title {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: clamp(48px, 8vw, 100px);
    line-height: 0.88;
    letter-spacing: -0.02em;
    color: var(--text);
    margin-bottom: 22px;
  }
  .hero-sub {
    font-family: var(--font-body);
    font-weight: 300;
    font-size: 14px;
    color: var(--muted);
    letter-spacing: 0.04em;
    max-width: 380px;
  }

  /* Hover info panel */
  .info-panel {
    position: fixed;
    top: 50%;
    right: 48px;
    transform: translateY(-50%) translateX(20px);
    width: 260px;
    background: rgba(0, 0, 12, 0.72);
    backdrop-filter: blur(28px);
    -webkit-backdrop-filter: blur(28px);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 8px;
    padding: 26px 24px;
    opacity: 0;
    transition: opacity 0.28s ease, transform 0.28s ease;
    z-index: 20;
    pointer-events: none;
  }
  .info-panel.visible {
    opacity: 1;
    transform: translateY(-50%) translateX(0);
  }
  .info-panel .panel-cat {
    font-family: 'Courier New', monospace;
    font-size: 9px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    margin-bottom: 12px;
  }
  .info-panel .panel-name {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 28px;
    line-height: 0.95;
    color: var(--text);
    margin-bottom: 12px;
  }
  .info-panel .panel-tagline {
    font-family: var(--font-body);
    font-weight: 300;
    font-size: 13px;
    color: rgba(255,255,255,0.5);
    line-height: 1.5;
    margin-bottom: 20px;
  }
  .info-panel .panel-status {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: 'Courier New', monospace;
    font-size: 9px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    padding: 5px 10px;
    border-radius: 3px;
  }
  .info-panel .panel-status.live {
    color: #4ade80;
    background: rgba(74,222,128,0.1);
    border: 1px solid rgba(74,222,128,0.2);
  }
  .info-panel .panel-status.dev {
    color: rgba(255,255,255,0.45);
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
  }
  .info-panel .panel-status::before {
    content: '';
    width: 5px; height: 5px;
    border-radius: 50%;
    background: currentColor;
  }
  .info-panel .panel-accent-bar {
    height: 2px;
    width: 100%;
    border-radius: 1px;
    margin-bottom: 20px;
    opacity: 0.6;
  }

  /* Concept switcher */
  .switcher {
    position: fixed;
    bottom: 28px;
    right: 36px;
    display: flex;
    align-items: center;
    gap: 6px;
    z-index: 30;
    pointer-events: all;
  }
  .switcher-label {
    font-family: 'Courier New', monospace;
    font-size: 9px;
    letter-spacing: 0.15em;
    color: var(--muted);
    text-transform: uppercase;
    margin-right: 6px;
  }
  .switcher a {
    font-family: 'Courier New', monospace;
    font-size: 9px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    text-decoration: none;
    padding: 5px 10px;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 3px;
    transition: color 0.2s, border-color 0.2s;
  }
  .switcher a:hover { color: var(--text); border-color: rgba(255,255,255,0.25); }
  .switcher a.active { color: var(--text); border-color: rgba(255,255,255,0.3); }

  /* Object labels (3D → 2D projected) */
  .obj-label {
    position: fixed;
    transform: translateX(-50%);
    text-align: center;
    pointer-events: none;
    transition: opacity 0.25s ease;
    z-index: 15;
  }
  .obj-label .label-name {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 12px;
    letter-spacing: 0.06em;
    color: rgba(255,255,255,0.75);
    display: block;
    margin-bottom: 2px;
  }
  .obj-label .label-cat {
    font-family: 'Courier New', monospace;
    font-size: 8px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    display: block;
  }
</style>
</head>
<body>

<canvas id="three-canvas"></canvas>

<div class="overlay">
  <nav class="nav">
    <span class="nav-brand">Construx Group</span>
    <span class="nav-label">Concept B — 3D Geometric</span>
  </nav>
  <div class="hero">
    <div class="hero-eyebrow">A group of AI-native ventures</div>
    <div class="hero-title">CONSTRUX<br>GROUP</div>
    <div class="hero-sub">We build what only AI makes possible.</div>
  </div>
</div>

<!-- Hover info panel -->
<div class="info-panel" id="infoPanel">
  <div class="panel-accent-bar" id="panelAccentBar"></div>
  <div class="panel-cat" id="panelCat"></div>
  <div class="panel-name" id="panelName"></div>
  <div class="panel-tagline" id="panelTagline"></div>
  <div class="panel-status" id="panelStatus"></div>
</div>

<!-- Object labels -->
<div id="labels"></div>

<!-- Concept switcher -->
<div class="switcher">
  <span class="switcher-label">Concepts</span>
  <a href="/concept-a.html">A</a>
  <a href="/concept-b.html" class="active">B</a>
  <a href="/concept-c.html">C</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.163.0/build/three.min.js"></script>
<script>
const VENTURES = [
  { name: 'Scoutr',           tagline: 'Find what others miss.',          accent: '#C8F50C', status: 'live', category: 'Resell Intelligence' },
  { name: 'The Marqet',       tagline: 'The App Store for Claude AI.',    accent: '#3B82F6', status: 'live', category: 'AI Marketplace'      },
  { name: 'The Hyve',         tagline: 'Where AI teams actually work.',   accent: '#8B5CF6', status: 'live', category: 'AI Workspace'        },
  { name: 'Construx Daily',   tagline: 'AI intelligence, delivered daily.',accent: '#F59E0B', status: 'dev',  category: 'AI Newsletter'      },
  { name: 'Construx Studio',  tagline: 'Beautiful software, built fast.', accent: '#06B6D4', status: 'dev',  category: 'Web Studio'          },
];

// ─── Scene setup ───────────────────────────────────────────────────────────
const canvas = document.getElementById('three-canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x000008, 1);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(0, 0, 20);
camera.lookAt(0, 0, 0);

// Ambient — barely there
const ambient = new THREE.AmbientLight(0x0a0a18, 0.8);
scene.add(ambient);

// Fog — deep void atmosphere
scene.fog = new THREE.FogExp2(0x000008, 0.018);

// ─── Geometries per venture ────────────────────────────────────────────────
const GEO_FACTORIES = [
  () => new THREE.OctahedronGeometry(1.15, 0),
  () => new THREE.IcosahedronGeometry(1.1, 0),
  () => new THREE.TorusKnotGeometry(0.85, 0.28, 80, 16),
  () => new THREE.TetrahedronGeometry(1.3, 0),
  () => new THREE.DodecahedronGeometry(1.05, 0),
];

const X_POSITIONS = [-8.5, -4.2, 0, 4.2, 8.5];
const Y_BASE = -0.4;

// Objects array: each entry holds mesh, wireframe, light, target state
const objects = VENTURES.map((v, i) => {
  const accentColor = new THREE.Color(v.accent);

  // Main mesh
  const geo = GEO_FACTORIES[i]();
  const mat = new THREE.MeshPhongMaterial({
    color: new THREE.Color(v.accent).multiplyScalar(0.12),
    emissive: accentColor.clone().multiplyScalar(0.35),
    emissiveIntensity: 1.0,
    shininess: 60,
    transparent: true,
    opacity: 0.82,
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(X_POSITIONS[i], Y_BASE, 0);
  mesh.userData.ventureIndex = i;
  scene.add(mesh);

  // Wireframe overlay
  const wGeo = geo.clone();
  const wMat = new THREE.MeshBasicMaterial({
    color: accentColor,
    wireframe: true,
    transparent: true,
    opacity: 0.08,
  });
  const wireframe = new THREE.Mesh(wGeo, wMat);
  mesh.add(wireframe);

  // Point light at object
  const light = new THREE.PointLight(accentColor, 1.2, 12);
  light.position.set(X_POSITIONS[i], Y_BASE, 2);
  scene.add(light);

  // Ambient glow sphere (large, very faint — bloom substitute)
  const glowGeo = new THREE.SphereGeometry(3.5, 8, 8);
  const glowMat = new THREE.MeshBasicMaterial({
    color: accentColor,
    transparent: true,
    opacity: 0.022,
    side: THREE.BackSide,
  });
  const glow = new THREE.Mesh(glowGeo, glowMat);
  glow.position.copy(mesh.position);
  scene.add(glow);

  return {
    mesh, wireframe, light, glow,
    mat, wMat,
    targetZ: 0,
    currentZ: 0,
    targetWireOpacity: 0.08,
    targetLightIntensity: 1.2,
    targetEmissive: 0.35,
    rotSpeed: { x: 0.003 + i * 0.0008, y: 0.004 + i * 0.0006 },
  };
});

// ─── Raycaster + hover ──────────────────────────────────────────────────────
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2(-9999, -9999);
let hoveredIdx = -1;
const infoPanel = document.getElementById('infoPanel');

document.addEventListener('mousemove', e => {
  pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
  pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
});

function showPanel(idx) {
  if (idx === hoveredIdx) return;
  hoveredIdx = idx;
  if (idx < 0) {
    infoPanel.classList.remove('visible');
    return;
  }
  const v = VENTURES[idx];
  document.getElementById('panelCat').textContent = v.category;
  document.getElementById('panelCat').style.color = v.accent;
  document.getElementById('panelName').textContent = v.name;
  document.getElementById('panelTagline').textContent = v.tagline;
  const statusEl = document.getElementById('panelStatus');
  statusEl.textContent = v.status === 'live' ? 'Live' : 'In Development';
  statusEl.className = 'panel-status ' + v.status;
  document.getElementById('panelAccentBar').style.background = v.accent;
  infoPanel.classList.add('visible');
}

// ─── 2D Labels ──────────────────────────────────────────────────────────────
const labelsContainer = document.getElementById('labels');
const labelEls = VENTURES.map((v, i) => {
  const el = document.createElement('div');
  el.className = 'obj-label';
  el.innerHTML = `<span class="label-name">${v.name}</span><span class="label-cat" style="color:${v.accent}">${v.category}</span>`;
  labelsContainer.appendChild(el);
  return el;
});

function projectToScreen(worldPos) {
  const pos = worldPos.clone().project(camera);
  return {
    x: (pos.x * 0.5 + 0.5) * window.innerWidth,
    y: (-pos.y * 0.5 + 0.5) * window.innerHeight,
  };
}

// ─── Resize ─────────────────────────────────────────────────────────────────
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ─── Render loop ────────────────────────────────────────────────────────────
const clock = new THREE.Clock();
const meshes = objects.map(o => o.mesh);

function animate() {
  requestAnimationFrame(animate);
  const delta = clock.getDelta();
  const elapsed = clock.getElapsedTime();

  // Raycast
  raycaster.setFromCamera(pointer, camera);
  const intersects = raycaster.intersectObjects(meshes);
  const hitIdx = intersects.length > 0 ? intersects[0].object.userData.ventureIndex : -1;
  showPanel(hitIdx);

  // Update objects
  objects.forEach((obj, i) => {
    const isHovered = i === hoveredIdx;

    // Rotation — hover slows and tilts
    if (isHovered) {
      obj.mesh.rotation.x += obj.rotSpeed.x * 0.4;
      obj.mesh.rotation.y += obj.rotSpeed.y * 0.4;
    } else {
      obj.mesh.rotation.x += obj.rotSpeed.x;
      obj.mesh.rotation.y += obj.rotSpeed.y;
    }

    // Gentle float
    obj.mesh.position.y = Y_BASE + Math.sin(elapsed * 0.6 + i * 1.3) * 0.18;

    // Z movement on hover
    obj.targetZ = isHovered ? 3.2 : 0;
    obj.currentZ += (obj.targetZ - obj.currentZ) * 0.08;
    obj.mesh.position.z = obj.currentZ;
    obj.glow.position.z = obj.currentZ;
    obj.light.position.z = 2 + obj.currentZ;

    // Emissive intensity
    const targetEmissive = isHovered ? 0.72 : 0.35;
    const curr = obj.mat.emissiveIntensity;
    obj.mat.emissiveIntensity = curr + (targetEmissive - curr) * 0.07;

    // Wireframe opacity
    const targetWO = isHovered ? 0.28 : 0.08;
    const currWO = obj.wMat.opacity;
    obj.wMat.opacity = currWO + (targetWO - currWO) * 0.07;

    // Light intensity
    const targetLI = isHovered ? 3.5 : 1.2;
    obj.light.intensity += (targetLI - obj.light.intensity) * 0.07;

    // Scale pulse on hover
    const targetScale = isHovered ? 1.12 : 1.0;
    const cs = obj.mesh.scale.x;
    const ns = cs + (targetScale - cs) * 0.07;
    obj.mesh.scale.set(ns, ns, ns);

    // Update label position
    const labelPos = obj.mesh.position.clone();
    labelPos.y -= 1.8;
    const screen = projectToScreen(labelPos);
    const lbl = labelEls[i];
    lbl.style.left = screen.x + 'px';
    lbl.style.top = screen.y + 'px';
    lbl.style.opacity = isHovered ? 0 : 0.7;
  });

  // Very slow camera drift
  camera.position.x = Math.sin(elapsed * 0.04) * 0.6;
  camera.position.y = Math.sin(elapsed * 0.03) * 0.25;
  camera.lookAt(0, Y_BASE, 0);

  renderer.render(scene, camera);
}

animate();
</script>
</body>
</html>
